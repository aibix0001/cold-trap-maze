[workspace]
resolver = "2"
members = ["crates/sim", "crates/pilot", "crates/server", "crates/setbuilder"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/aibix0001/cold-trap-maze"

[workspace.dependencies]
cold-trap-sim = { path = "crates/sim" }
cold-trap-pilot = { path = "crates/pilot" }
rand = "0.10"
rand_chacha = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs", "cors", "trace"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
